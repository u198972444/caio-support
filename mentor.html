<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CAIO 語音導師</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
  background: #0a0c12; color: #e8eaf0;
  position: relative;
}
.bg-glow {
  position: fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(ellipse 600px 400px at 20% 10%, rgba(108,140,255,.08), transparent),
    radial-gradient(ellipse 500px 500px at 80% 90%, rgba(167,139,250,.06), transparent);
}
.topbar {
  position: fixed; top:0; left:0; right:0; z-index:10;
  padding:16px 24px; display:flex; align-items:center; justify-content:space-between;
  background: linear-gradient(to bottom, rgba(10,12,18,.9), transparent);
}
.mentor-id { display:flex; align-items:center; gap:10px; }
.mentor-dot { width:10px; height:10px; border-radius:50%; background:#34d399; box-shadow:0 0 12px #34d399; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.5;} }
.mentor-id span { font-size:14px; color:#9ca3b8; }
.topbar-right { font-size:12px; color:#6b7280; cursor:pointer; }
.chat {
  position: absolute; top:60px; bottom:120px; left:0; right:0;
  overflow-y:auto; padding:20px 24px; z-index:1;
}
.chat::-webkit-scrollbar { width:0; }
.bubble { max-width: 85%; margin-bottom:20px; animation: slideUp .4s ease; }
@keyframes slideUp { from{opacity:0;transform:translateY(16px);} to{opacity:1;transform:translateY(0);} }
.bubble.mentor { margin-right:auto; }
.bubble.user { margin-left:auto; text-align:right; }
.bubble-text { display:inline-block; padding:16px 20px; border-radius:20px; font-size:17px; line-height:1.75; }
.bubble.mentor .bubble-text { background: rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08); border-bottom-left-radius:6px; }
.bubble.user .bubble-text { background: linear-gradient(135deg, #4f6df5, #7c5cf0); border-bottom-right-radius:6px; }
.viz { margin:12px 0; padding:20px; background: rgba(108,140,255,.08); border:1px solid rgba(108,140,255,.2); border-radius:16px; max-width:520px; }
.viz-title { font-size:13px; color:#6c8cff; margin-bottom:12px; font-weight:600; }
.viz-flow { display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; }
.viz-node { padding:10px 14px; border-radius:10px; font-size:13px; text-align:center; background:rgba(255,255,255,.08); min-width:70px; }
.viz-node.highlight { background:rgba(108,140,255,.25); border:1px solid #6c8cff; }
.viz-arrow { color:#6c8cff; font-size:18px; }
.viz-caption { font-size:12px; color:#9ca3b8; margin-top:10px; text-align:center; }
.viz-bar-chart { display:flex; align-items:flex-end; gap:12px; height:120px; padding:10px 0; }
.viz-bar { flex:1; border-radius:6px 6px 0 0; background:linear-gradient(to top,#6c8cff,#a78bfa); position:relative; min-height:20px; }
.viz-bar .val { position:absolute; top:-20px; left:50%; transform:translateX(-50%); font-size:11px; white-space:nowrap; }
.viz-bar .lbl { position:absolute; bottom:-22px; left:50%; transform:translateX(-50%); font-size:10px; color:#9ca3b8; white-space:nowrap; }
.viz-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.viz-cell { padding:10px; background:rgba(255,255,255,.06); border-radius:8px; font-size:12px; text-align:center; }
.viz-cell strong { color:#34d399; }
.wave { display:flex; align-items:center; gap:3px; height:24px; margin:4px 0; }
.wave span { display:block; width:3px; background:#6c8cff; border-radius:2px; animation: wave 1s ease-in-out infinite; }
@keyframes wave { 0%,100% { height:6px; } 50% { height:20px; } }
.wave span:nth-child(2) { animation-delay:.1s; } .wave span:nth-child(3) { animation-delay:.2s; }
.wave span:nth-child(4) { animation-delay:.3s; } .wave span:nth-child(5) { animation-delay:.4s; }
.voice-bar {
  position: fixed; bottom:0; left:0; right:0; z-index:10;
  padding:20px; display:flex; flex-direction:column; align-items:center;
  background: linear-gradient(to top, #0a0c12 60%, transparent);
}
.listening-hint { font-size:13px; color:#9ca3b8; margin-bottom:12px; height:18px; }
.mic-btn {
  width:72px; height:72px; border-radius:50%; border:none; cursor:pointer;
  background: linear-gradient(135deg,#4f6df5,#7c5cf0); color:white; font-size:28px;
  box-shadow: 0 8px 32px rgba(79,109,245,.4); transition: all .2s;
}
.mic-btn:active { transform:scale(.92); }
.mic-btn.listening { background: linear-gradient(135deg,#f87171,#ef4444); animation: micPulse 1.5s infinite; }
@keyframes micPulse { 0%,100% { box-shadow:0 0 0 0 rgba(248,113,113,.5); } 50% { box-shadow:0 0 0 20px rgba(248,113,113,0); } }

/* 開始遮罩（解決手機無聲音問題） */
.start-overlay {
  position: fixed; inset:0; z-index:100;
  background: #0a0c12;
  display: flex; flex-direction:column; align-items:center; justify-content:center;
  gap:24px;
}
.start-overlay h2 { font-size:24px; background:linear-gradient(135deg,#6c8cff,#a78bfa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.start-overlay p { color:#9ca3b8; font-size:14px; text-align:center; max-width:300px; line-height:1.7; }
.start-btn {
  padding:16px 48px; border-radius:30px; border:none; cursor:pointer;
  background: linear-gradient(135deg,#4f6df5,#7c5cf0); color:white; font-size:17px;
  box-shadow:0 8px 32px rgba(79,109,245,.4);
}
.start-btn:active { transform:scale(.96); }

@media (max-width:600px) {
  .bubble-text { font-size:16px; padding:14px 16px; }
  .chat { padding:16px; bottom:140px; }
}
</style>
</head>
<body>
<div class="bg-glow"></div>

<!-- 開始遮罩：解決手機瀏覽器自動播放限制 -->
<div class="start-overlay" id="startOverlay">
  <h2>🎓 CAIO 語音導師</h2>
  <p>點下面按鈕開始語音對話<br>（瀏覽器需要你先點一下才能開聲音和麥克風）</p>
  <button class="start-btn" id="startBtn">開始對話</button>
</div>

<div class="topbar">
  <div class="mentor-id">
    <div class="mentor-dot"></div>
    <span>CAIO 語音導師</span>
  </div>
  <div class="topbar-right" id="resetBtn">🔄 清除對話紀錄</div>
</div>

<div class="chat" id="chat"></div>

<div class="voice-bar">
  <div class="listening-hint" id="hint">點麥克風開始說話</div>
  <button class="mic-btn" id="micBtn">🎤</button>
</div>

<script>
// ===== 課程資料 =====
const CURRICULUM = [
  { stage:'S1', lessons:[
    {id:'s1_01', title:'大模型', explain:'大模型就像讀過全世界所有書的超級實習生，你問它問題，它根據讀過的內容猜下一個字。不是它懂，是讀太多所以猜得準。', case:'ChatGPT 寫程式比資深工程師快 3 倍。', viz:'bigmodel'},
    {id:'s1_02', title:'RAG', explain:'RAG 就是開書考試。一般 AI 閉卷會亂掰，RAG 讓它先讀你公司文件再回答，答案就有根據。', case:'摩根大通用 RAG 讀合約，準確率從 60% 升到 92%，法務工時減 40%。', viz:'rag'},
    {id:'s1_03', title:'Token 成本', explain:'Token 是 AI 眼中的字。1 個中文字約 1.5 token。GPT-4 輸入每百萬 token 收 30 美元。', case:'一個員工每天用 AI 寫 100 封信約 0.5 美元。50 人部門每月約 2-5 萬台幣。', viz:'cost'},
  ]},
  { stage:'S2', lessons:[
    {id:'s2_01', title:'Agent', explain:'Agent 是讓 AI 不只會回答，還會自己呼叫工具、操作軟體、完成任務。像數位員工，你交代目標它自己規劃步驟。', case:'Devin AI 被稱為第一個 AI 工程師，估值 20 億美元。', viz:'agent'},
    {id:'s2_02', title:'Function Calling', explain:'Function Calling 讓 AI 呼叫你寫好的程式功能。它決定要查訂單就呼叫查訂單 API，不會自己編。', case:'Salesforce 用它自動調 CRM，查客戶資料從 5 分鐘降到 30 秒。', viz:'funcall'},
  ]},
  { stage:'S8', lessons:[
    {id:'s8_01', title:'找場景', explain:'不要從技術出發，從痛點出發。找三個指標：高頻、高耗時、高規則性。三個都符合就是好場景。', case:'麥肯錫建議從客服、文件處理、銷售預測切入，ROI 最高。', viz:'roi'},
    {id:'s8_02', title:'賣 AI 給老闆', explain:'老闆只看三個東西：省多少錢、賺多少錢、風險多大。把 AI 專案換算成數字。', case:'HubSpot 調查：導入 AI 銷售工具，業務節省 30% 行政時間，成交率升 15%。', viz:'sell'},
  ]},
];
const ALL_LESSONS = CURRICULUM.flatMap(s=>s.lessons);

// ===== 狀態 =====
const chat = document.getElementById('chat');
const micBtn = document.getElementById('micBtn');
const hint = document.getElementById('hint');
const synth = window.speechSynthesis;

let recognition = null;
let listening = false;
let isSpeaking = false;
let started = false;

// 讀取歷史
let history = JSON.parse(localStorage.getItem('caio_chat_history')||'[]');
let taughtLessons = JSON.parse(localStorage.getItem('caio_taught')||'[]');

// 選擇較自然的中文語音
let zhVoice = null;
function pickVoice() {
  const voices = synth.getVoices();
  // 偏好：zh-TW 或 zh-Hant，優先 Siri 或 Google
  zhVoice = voices.find(v => /zh-TW|zh_Hant|Taiwan/i.test(v.lang) && /Google|Sinji|Ting|Mei/i.test(v.name))
         || voices.find(v => /zh-TW|zh_Hant|Taiwan/i.test(v.lang))
         || voices.find(v => /zh/i.test(v.lang));
}
pickVoice();
if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = pickVoice;

// ===== 對話歷史 =====
function saveHistory() {
  localStorage.setItem('caio_chat_history', JSON.stringify(history.slice(-50)));
}
function saveTaught() {
  localStorage.setItem('caio_taught', JSON.stringify(taughtLessons));
}

function addBubble(text, who='mentor', vizHtml='') {
  const div = document.createElement('div');
  div.className = 'bubble ' + who;
  div.innerHTML = `<div class="bubble-text">${text}</div>${vizHtml}`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

// ===== 語音 =====
function speak(text) {
  if (!synth) return;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-TW';
  u.rate = 1.15; // 1.2 倍速
  u.pitch = 1.05;
  if (zhVoice) u.voice = zhVoice;
  isSpeaking = true;
  hint.textContent = '導師正在說話…';
  u.onend = () => {
    isSpeaking = false;
    hint.textContent = '點麥克風說話';
  };
  synth.speak(u);
}

// ===== 視覺圖解 =====
function vizHTML(type) {
  const v = {
    bigmodel: `<div class="viz"><div class="viz-title">🧠 大模型運作</div><div class="viz-flow"><div class="viz-node highlight">讀過所有書</div><div class="viz-arrow">→</div><div class="viz-node">你問問題</div><div class="viz-arrow">→</div><div class="viz-node highlight">猜下一個字</div></div><div class="viz-caption">不是懂，是讀太多猜得準</div></div>`,
    rag: `<div class="viz"><div class="viz-title">📚 RAG = 開書考試</div><div class="viz-flow"><div class="viz-node">你的問題</div><div class="viz-arrow">→</div><div class="viz-node highlight">先查公司文件</div><div class="viz-arrow">→</div><div class="viz-node">用查到的回答</div></div><div class="viz-caption">答案有根據，不會亂掰</div></div>`,
    cost: `<div class="viz"><div class="viz-title">💰 每月成本比較（50人公司）</div><div class="viz-bar-chart"><div class="viz-bar" style="height:30%"><span class="val">2萬</span><span class="lbl">工具</span></div><div class="viz-bar" style="height:60%"><span class="val">5萬</span><span class="lbl">API</span></div><div class="viz-bar" style="height:100%"><span class="val">150萬</span><span class="lbl">一個人</span></div></div><div class="viz-caption">AI 比聘人便宜 10 倍</div></div>`,
    agent: `<div class="viz"><div class="viz-title">🤖 Agent = 數位員工</div><div class="viz-flow"><div class="viz-node">交代目標</div><div class="viz-arrow">→</div><div class="viz-node highlight">自己規劃步驟</div><div class="viz-arrow">→</div><div class="viz-node">呼叫工具執行</div><div class="viz-arrow">→</div><div class="viz-node">完成</div></div></div>`,
    funcall: `<div class="viz"><div class="viz-title">🔧 Function Calling</div><div class="viz-flow"><div class="viz-node">AI 判斷要查訂單</div><div class="viz-arrow">→</div><div class="viz-node highlight">呼叫 API</div><div class="viz-arrow">→</div><div class="viz-node">拿回真實資料</div></div><div class="viz-caption">不會編造</div></div>`,
    roi: `<div class="viz"><div class="viz-title">🎯 找場景三指標</div><div class="viz-grid"><div class="viz-cell">🔄 <strong>高頻</strong><br>每天做</div><div class="viz-cell">⏱️ <strong>高耗時</strong><br>花時間</div><div class="viz-cell">📋 <strong>高規則</strong><br>有 SOP</div><div class="viz-cell">✅ <strong>三個都中</strong><br>好場景</div></div></div>`,
    sell: `<div class="viz"><div class="viz-title">📊 跟老闆提案</div><div class="viz-bar-chart"><div class="viz-bar" style="height:25%"><span class="val">50萬</span><span class="lbl">投入</span></div><div class="viz-bar" style="height:80%"><span class="val">200萬</span><span class="lbl">回收</span></div><div class="viz-bar" style="height:100%"><span class="val">300%</span><span class="lbl">ROI</span></div></div><div class="viz-caption">第一頁寫數字</div></div>`,
  };
  return v[type] || '';
}

// ===== 導師回應 =====
function mentorReply(userText) {
  const t = userText.toLowerCase();
  history.push({role:'user', text:userText});
  saveHistory();

  // 找課程
  for (const l of ALL_LESSONS) {
    const kws = l.title.replace(/[，。？！]/g,' ').split(/\s+/);
    for (const kw of kws) {
      if (kw.length >= 2 && t.includes(kw.toLowerCase())) {
        // 如果之前教過這課，簡短帶過
        const alreadyTaught = taughtLessons.includes(l.id);
        let reply;
        if (alreadyTaught) {
          reply = `你之前聽過「${l.title}」了，我簡單複習：${l.explain}`;
        } else {
          reply = `${l.explain}<br><br><span style="color:#34d399;font-size:14px">📌 ${l.case}</span>`;
          taughtLessons.push(l.id);
          saveTaught();
        }
        const viz = alreadyTaught ? '' : vizHTML(l.viz);
        addBubble(reply, 'mentor', viz);
        history.push({role:'mentor', text:reply});
        saveHistory();
        speak(`${l.explain} ${l.case}`);
        return;
      }
    }
  }

  // 打招呼
  if (t.includes('你好') || t.includes('早安') || t.includes('嗨')) {
    let reply;
    if (taughtLessons.length > 0) {
      reply = `你好！我們之前聊過 ${taughtLessons.length} 個主題了。接著想學什麼？可以問我 Agent、AI 成本，或說「教我新的」。`;
    } else {
      reply = '你好！我是你的 CAIO 語音導師。你想學什麼？我建議從 RAG 開始，這是企業落地最常用的技術。';
    }
    addBubble(reply, 'mentor');
    history.push({role:'mentor', text:reply});
    saveHistory();
    speak(reply);
    return;
  }

  // 教我新的
  if (t.includes('教我') || t.includes('新的') || t.includes('繼續')) {
    const untought = ALL_LESSONS.filter(l => !taughtLessons.includes(l.id));
    const pool = untought.length > 0 ? untought : ALL_LESSONS;
    const l = pool[Math.floor(Math.random()*pool.length)];
    taughtLessons.push(l.id);
    saveTaught();
    const viz = vizHTML(l.viz);
    addBubble(`${l.explain}<br><br><span style="color:#34d399;font-size:14px">📌 ${l.case}</span>`, 'mentor', viz);
    history.push({role:'mentor', text:l.explain});
    saveHistory();
    speak(`${l.explain} ${l.case}`);
    return;
  }

  // 預設
  const def = '這是個好問題。你可以問我 RAG、Agent、AI 成本，或說「教我新的」讓我推薦一堂。';
  addBubble(def, 'mentor');
  history.push({role:'mentor', text:def});
  saveHistory();
  speak(def);
}

// ===== 語音辨識（只在使用者主動點麥克風時啟動，不會每句自動要求權限）=====
function setupRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const r = new SR();
  r.lang = 'zh-TW';
  r.continuous = false;
  r.interimResults = false;
  r.onresult = (e) => {
    const text = e.results[0][0].transcript;
    addBubble(text, 'user');
    listening = false;
    micBtn.classList.remove('listening');
    hint.textContent = '思考中…';
    setTimeout(() => mentorReply(text), 400);
  };
  r.onend = () => { listening = false; micBtn.classList.remove('listening'); if (!isSpeaking) hint.textContent='點麥克風說話'; };
  r.onerror = (e) => {
    listening = false; micBtn.classList.remove('listening');
    if (e.error === 'not-allowed') hint.textContent = '麥克風權限被拒，請在瀏覽器設定允許';
    else hint.textContent = '沒聽清楚，再點一次麥克風';
  };
  return r;
}

function startListen() {
  if (isSpeaking) { synth.cancel(); isSpeaking=false; }
  if (!recognition) recognition = setupRecognition();
  if (!recognition) { alert('瀏覽器不支援語音辨識'); return; }
  listening = true;
  micBtn.classList.add('listening');
  hint.textContent = '我在聽…請說';
  recognition.start();
}

micBtn.addEventListener('click', () => {
  if (listening) { recognition && recognition.stop(); return; }
  startListen();
});

// ===== 清除紀錄 =====
document.getElementById('resetBtn').addEventListener('click', () => {
  localStorage.removeItem('caio_chat_history');
  localStorage.removeItem('caio_taught');
  location.reload();
});

// ===== 開始按鈕（解決手機自動播放限制）=====
document.getElementById('startBtn').addEventListener('click', () => {
  document.getElementById('startOverlay').style.display = 'none';
  started = true;
  // 恢復歷史對話
  if (history.length > 0) {
    for (const msg of history) {
      addBubble(msg.text, msg.role === 'user' ? 'user' : 'mentor');
    }
    const greeting = `歡迎回來！我們之前聊過 ${taughtLessons.length} 個主題。接著想學什麼？`;
    addBubble(greeting, 'mentor');
    speak(greeting);
  } else {
    const greeting = '你好！我是你的 CAIO 語音導師。我的目標是幫你成為具備 AI 商業落地能力、有銷售意識、能為公司做 AI 規劃的人才。你可以直接跟我說話，問我任何 AI 問題。今天想從哪裡開始？';
    addBubble(greeting, 'mentor');
    speak(greeting);
  }
});
</script>
</body>
</html>
